name: 天浜線運用表を自動更新

on:
  push:
    paths:
      - ".github/workflows/update-tenhama-assignments.yml"
      - "scripts/update-tenhama-assignments.py"
      - "scripts/test_update_tenhama_assignments.py"
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tenhama-assignments
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pypdf>=6,<7"
      - name: 公式運用表を取得
        run: python scripts/update-tenhama-assignments.py
      - name: 変換処理を確認
        run: python -m unittest scripts/test_update_tenhama_assignments.py
      - name: 表示テスト
        run: npm test
      - name: 更新を保存
        run: |
          if git diff --quiet -- tenhama-assignments.mjs; then
            echo "運用表に変更はありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tenhama-assignments.mjs
          git commit -m "天浜線の公式車両運用表を自動更新"
          git push
