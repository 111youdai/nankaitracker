<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>南海列車位置</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="header-top-row">
            <h1>🚃 南海列車位置</h1>

            <button id="versionBtn" type="button">
                📜 更新履歴
            </button>
        </div>

        <div class="line-switcher" role="tablist" aria-label="表示路線切替">
            <button
                id="nankaiLineBtn"
                class="line-switch-btn"
                type="button"
                data-line-mode="nankai"
                role="tab"
            >
                🔒 南海線
            </button>

            <button
                id="koyaLineBtn"
                class="line-switch-btn"
                type="button"
                data-line-mode="koya"
                role="tab"
            >
                高野線
            </button>
        </div>

        <p id="currentLineLabel">高野線・泉北線</p>
        <p id="updateTime">更新中...</p>
    </header>

    <main>
        <div id="line"></div>
    </main>

    <div id="detailPanel">
        <button id="closeButton" type="button">×</button>
        <div id="detailContent"></div>
    </div>

    <dialog id="nankaiAuthModal">
        <form id="nankaiAuthForm" method="dialog">
            <div class="auth-header">
                <h2>🔒 南海線</h2>

                <button
                    id="closeAuthModal"
                    type="button"
                    aria-label="閉じる"
                >
                    ×
                </button>
            </div>

            <p>
                南海線の閲覧には
                共通パスワードが必要です。
            </p>

            <label for="nankaiPassword">
                パスワード
            </label>

            <input
                id="nankaiPassword"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >

            <p
                id="nankaiAuthError"
                class="auth-error"
                aria-live="polite"
            ></p>

            <button
                id="nankaiAuthSubmit"
                class="auth-submit"
                type="submit"
            >
                南海線を開く
            </button>
        </form>
    </dialog>

    <dialog id="versionModal">
        <div class="version-header">
            <h2>📜 更新履歴</h2>

            <button id="closeModal" type="button">
                ×
            </button>
        </div>

        <p>
            <b>Ver 1.2.1</b><br>
            ・南海線に共通パスワード認証を追加<br>
            ・認証済みのタブでは再入力を省略
        </p>

        <p>
            <b>Ver 1.2.0</b><br>
            ・南海線／高野線の切替に対応<br>
            ・南海本線、空港線、高師浜線、多奈川線、加太線を表示<br>
            ・南海線の列車詳細APIに対応
        </p>

        <p>
            <b>Ver 1.1.0</b><br>
            ・泉北線対応
        </p>

        <p>
            <b>Ver 1.0.2</b><br>
            ・Render API対応<br>
            ・スマホ対応
        </p>

        <p>
            <b>Ver 1.0.1</b><br>
            ・列車詳細画面追加
        </p>

        <p>
            <b>Ver 1.0.0</b><br>
            ・南海トラッカー公開
        </p>
    </dialog>

    <script src="api.js"></script>
    <script src="ui.js"></script>
    <script type="module" src="script.js"></script>

</body>
</html>
