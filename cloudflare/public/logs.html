<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>定期外ログ | 南海トラッカー</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0d1720;color:#e8f2f6}*{box-sizing:border-box}body{max-width:1100px;margin:auto;padding:24px}h1{margin:8px 0}small,.muted{color:#abc0ce}p{line-height:1.7}header{margin-bottom:24px}.label{color:#65e0ba;font-size:12px;letter-spacing:2px}.panel,article{border:1px solid #324550;border-radius:12px;background:#14232e;padding:18px;margin-bottom:14px}input,select,button{font:inherit;border-radius:7px;border:1px solid #48606e;padding:10px;background:#0d1720;color:inherit}button{cursor:pointer;background:#1b554b}button:disabled{opacity:.5;cursor:wait}form,.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}label{display:flex;flex-direction:column;gap:6px;font-size:13px}#status{border-left:4px solid #e5b858}#status.ok{border-color:#65e0ba}.error{color:#ffc6b9}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}h2{font-size:22px;margin:0}.tag{background:#624b23;border-radius:5px;padding:4px 7px;font-size:12px}.tag.known{background:#12604d;color:#e2fff7}.known-service{margin-top:14px;padding:12px 14px;border-left:4px solid #65e0ba;border-radius:7px;background:#102d2b;display:grid;gap:5px}.known-service strong{color:#8ff0d2}.details{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:16px 0}.details b{display:block;margin-top:4px;font-size:15px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#0d1720;padding:12px;border-radius:7px}.history{margin-top:12px;border-top:1px solid #324550;padding-top:12px}#error{min-height:24px}a{color:#8ddac7}[hidden]{display:none!important}@media(max-width:540px){body{padding:14px}.details{grid-template-columns:1fr}input{max-width:100%}h1{font-size:26px}}
</style></head><body>
<header><span class="label">NANKAI TRACKER / RECORDS</span><h1>定期外列車の記録</h1><p class="muted">Cloudflareで毎分監視。南海線・高野線・泉北線・支線。通常の平日／休日ダイヤにない列番の確認履歴。</p></header>
<section class="panel" id="loginPanel"><form id="login"><label>ログ閲覧パスワード<input id="password" type="password" required autocomplete="current-password"></label><button>ログを開く</button></form></section>
<div id="error" class="error" role="alert"></div>
<main id="main" hidden><div class="panel" id="status" role="status">監視状況を確認中…</div>
<div class="panel"><form id="filters"><label>運行日（午前4時区切り）<input id="date" type="date"></label><label>系統<select id="group"><option value="">すべて</option><option value="nankai">南海線系統</option><option value="koya">高野線系統</option></select></label><label>列番・編成番号<input id="query" placeholder="例：8310"></label><button>検索・更新</button><button type="button" id="export">検索結果をJSON保存</button><button type="button" id="logout">ログアウト</button></form></div>
<p class="muted">「定期外候補」は試運転・臨時回送の確定ではありません。運用表の未収録・配信誤りも含みます。編成はAPIの編成番号で、全車両の車番一覧ではありません。</p>
<section id="events" aria-live="polite"></section><button id="more" hidden>続きを読み込む</button>
<p class="muted">取得元：<a href="https://unyohub.2pd.jp/" target="_blank" rel="noopener">鉄道運用Hub</a>（通常ダイヤ照合）／南海アプリ配信データ（列番・編成・位置）。</p></main>
<script src="logs.js"></script></body></html>
